name: Update Lottery Data

on:
  schedule:
    # GitHub cron uses UTC. 06:30 UTC is 14:30 in Asia/Shanghai.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm update:data
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update lottery data'
          file_pattern: public/data/*.json

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
